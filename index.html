<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>

</style>

<body>
    <div id="teste">
        <button onclick="testar()">Testar</button>
    </div>
    <hr />
    <script>
        function testar() {
            const test = document.createElement('testar')
            test.innerHTML = 'testando '
            test.setAttribute('onclick', 'testar()')
            document.getElementById('teste').appendChild(test)
        }
    </script>

</body>

</html>
